    /* ==========================

       ========================== */
    const $ = (id) => document.getElementById(id);

    function log(message, type = "info") {
      const logEl = $("log");
      if (!logEl) return;
      const time = new Date().toLocaleTimeString();
      const safeMsg = String(message);
      const colorMap = { info: "var(--log-info)", warning: "var(--log-warning)", error: "var(--log-error)", debug: "var(--log-debug)" };
      const color = colorMap[type] || colorMap.info;
      const entry = `<div class="log-entry"><span class="log-time">[${time}]</span><span style="color:${color}">${escapeHtml(safeMsg)}</span></div>`;
      logEl.innerHTML = entry + logEl.innerHTML;
      console.log(`[${time}] ${safeMsg}`);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
    }

    /* ==========================
       BigInt helpers
       ========================== */
    function formatAmount(bn, decimals) {
      bn = BigInt(bn || 0n);
      const factor = 10n ** BigInt(decimals);
      const whole = bn / factor;
      const rem = bn % factor;
      if (rem === 0n) return whole.toString();
      let s = rem.toString().padStart(decimals, "0").replace(/0+$/, "");
      return `${whole.toString()}.${s}`;
    }

    function parseAmount(value, decimals) {
      const str = String(value);
      const [whole = "0", frac = ""] = str.split(".");
      const fracPadded = frac.padEnd(decimals, "0").slice(0, decimals);
      return BigInt(whole + fracPadded);
    }

/* ==========================
   Wallet connect/disconnect/UI
   ========================== */
async function connectWallet() {
  const btn = $("connectBtn");
  if (btn) {
    btn.disabled = true;
    btn.classList.add('loading');
  }

  try {
    log("🔍 Checking for wallet...", "info");
    
    if (typeof window.ethereum === 'undefined') {
      throw new Error("No wallet detected. Install MetaMask first.");
    }

    log("✓ Wallet detected", "debug");
    
    const accounts = await window.ethereum.request({ 
      method: "eth_requestAccounts" 
    });

    if (!accounts || accounts.length === 0) {
      throw new Error("No accounts available");
    }

    const chainId = await window.ethereum.request({ method: "eth_chainId" });
    
    if (chainId !== "0x8F" && chainId !== "0x8f") {
      log("Wrong network. Switching to Monad...", "warning");
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x8F" }]
        });
      } catch (switchError) {
        if (switchError && switchError.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0x8F",
              chainName: "Monad Mainnet",
              rpcUrls: [CONFIG.ALCHEMY_RPC],
              nativeCurrency: { name: "Monad", symbol: "MONAD", decimals: 18 },
              blockExplorerUrls: ["https://explorer.monad.xyz"]
            }]
          });
        } else {
          throw switchError;
        }
      }
    }

    walletProvider = new ethers.BrowserProvider(window.ethereum);
    signer = await walletProvider.getSigner();
    userAddress = await signer.getAddress();
    
    log("✅ Connected: " + (userAddress ? userAddress.slice(0,8) + "..." : userAddress), "info");
    updateWalletUI();
    await loadBalances();
    await loadPairReserves();
    
  } catch (err) {
    log("❌ Connection failed: " + (err && err.message ? err.message : String(err)), "error");
    console.error(err);
    walletProvider = signer = userAddress = null;
    updateWalletUI();
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }
}

async function disconnectWallet() {
  try {
    // Web3Auth logout removed (no-op if not used)
    walletProvider = null;
    signer = null;
    userAddress = null;

    updateWalletUI();

    ["balanceUSDC","balanceBFL","fromBalance","toBalance"].forEach(id => {
      if ($(id)) $(id).textContent = "-";
    });

    log("Wallet disconnected", "info");
  } catch (err) {
    log("Disconnect error: " + err.message, "error");

    walletProvider = null;
    signer = null;
    userAddress = null;
    updateWalletUI();
  }
}

function updateWalletUI() {
  const display = $("walletDisplay"), btn = $("connectBtn");
  if (!display || !btn) return;

  btn.disabled = false;
  btn.classList.remove("loading");

  if (userAddress) {
    display.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
    btn.textContent = "● Connected";
    btn.onclick = disconnectWallet;
    btn.classList.remove("btn-primary", "btn-red");
    btn.classList.add("btn-green");
  } else {
    display.textContent = "Not connected";
    btn.textContent = "Connect Wallet";
    btn.onclick = connectWallet;
    btn.classList.remove("btn-ghost", "btn-green");
    btn.classList.add("btn-red");
  }
}

/* ==========================
   Error helpers & diagnostics
   ========================== */
    const WALLET_ERROR_MESSAGES = {
      '-32002': '⚠️ You already have a pending wallet request. Please check your wallet and confirm or reject it first.',
      '4001': 'Transaction cancelled by the user.',
      '4100': 'The requested account and/or method has not been authorized.',
      '4900': 'The provider is disconnected. Please reconnect your wallet.',
      '4901': 'The provider is not connected to the requested chain. Please switch networks.',
      '-32603': 'Internal error. Please try again.',
    };

    function dumpError(err) {
      if (!err) return console.error("dumpError: no error object");
      try {
        console.error("=== ERROR DUMP START ===");
        console.error("Error object:", err);
        if (err?.reason) console.error("reason:", err.reason);
        if (err?.message) console.error("message:", err.message);
        if (err?.code) console.error("code:", err.code);
        if (err?.data) console.error("data:", err.data);
        if (err?.error) console.error("error:", err.error);
        if (err?.body) console.error("body:", err.body);
        if (typeof err?.body === "string") {
          try { console.error("body json:", JSON.parse(err.body)); } catch(e){}
        }
        const maybeData = err?.data?.data || err?.error?.data || err?.data;
        if (maybeData && typeof maybeData === "string" && maybeData.startsWith("0x")) {
          try {
            const toUtf8 = ethers.toUtf8String || (ethers.utils && ethers.utils.toUtf8String);
            try {
              console.error("decoded via toUtf8String:", toUtf8(maybeData));
            } catch (e) {
              try {
                const payload = "0x" + maybeData.replace(/^0x/, "").slice(8);
                console.error("decoded fallback:", toUtf8(payload));
              } catch (e2) {}
            }
          } catch (e) {
          }
        }
        console.error("=== ERROR DUMP END ===");
      } catch (e) {
        console.error("dumpError failed:", e);
      }
    }

    function isPendingRequest(err) {
      if (!err) return false;
      const candidates = [
        err?.code,
        err?.error?.code,
        err?.data?.code,
        err?.error?.data?.code,
        err?.error?.error?.code
      ];
      for (const c of candidates) {
        if (c === -32002 || String(c) === "-32002") return true;
      }
      const msg = String(err?.message || err?.error?.message || err?.data?.message || "").toLowerCase();
      if (!msg) return false;
      if (msg.includes("already pending") || msg.includes("public_signtransaction") || (msg.includes("request of type") && msg.includes("already pending"))) return true;
      return false;
    }

    function getWalletErrorMessage(err) {
      if (!err) return 'Unknown error';
      const nestedCodes = [ err?.code, err?.error?.code, err?.data?.code, err?.error?.data?.code ];
      for (const c of nestedCodes) {
        if (typeof c !== 'undefined' && c !== null) {
          const key = String(c);
          if (WALLET_ERROR_MESSAGES[key]) return WALLET_ERROR_MESSAGES[key];
        }
      }
      const raw = err?.message || err?.error?.message || err?.data?.message || JSON.stringify(err);
      const msg = String(raw).toLowerCase();
      if (msg.includes('already pending') || msg.includes('-32002') || msg.includes('public_signtransaction')) {
        return WALLET_ERROR_MESSAGES['-32002'];
      }
      if (msg.includes('user rejected') || msg.includes('rejected') || msg.includes('cancel')) return WALLET_ERROR_MESSAGES['4001'] || 'Transaction cancelled by user';
      if (msg.includes('insufficient funds')) return 'Insufficient funds for gas + transaction amount';
      return (WALLET_ERROR_MESSAGES['-32603'] || 'Internal error. Please try again.') + " — details: " + raw;
    }

      // Add loading skeleton to balance elements

      try {
        log("Loading balances...", "debug");
        const usdcContract = new ethers.Contract(ADDRESSES.USDC, ABIS.ERC20, readProvider);
        const bflContract = new ethers.Contract(ADDRESSES.BFL, ABIS.ERC20, readProvider);

        const [usdcBal, bflBal, usdcDec, bflDec] = await Promise.all([

          getDecimals(ADDRESSES.USDC, readProvider),
          getDecimals(ADDRESSES.BFL, readProvider)
        ]);

        if ($("balanceUSDC")) $("balanceUSDC").textContent = formatAmount(BigInt(usdcBal.toString()), usdcDec);
        if ($("balanceBFL")) $("balanceBFL").textContent = formatAmount(BigInt(bflBal.toString()), bflDec);
        if ($("fromBalance")) $("fromBalance").textContent = formatAmount(BigInt(usdcBal.toString()), usdcDec);
        if ($("toBalance")) $("toBalance").textContent = formatAmount(BigInt(bflBal.toString()), bflDec);

        log("Balances loaded", "debug");
      } catch (err) {
        log("Balance load failed: " + (err?.message || err), "error");
        dumpError(err);
      } finally {
        balanceElements.forEach(id => {
          const el = $(id);
          if (el) el.classList.remove('skeleton');
        });
      }
    }

    /* ==========================
       Swap handler & helpers
       ========================== */
    async function handleSwap() {
      const swapBtn = $("swapBtn");
      if (swapBtn) { swapBtn.disabled = true; swapBtn.classList.add('loading'); }
      let txInProgress = true;
      try {
        if (!signer || !userAddress) { log("Please connect wallet first", "warning"); throw new Error("no wallet"); }
        // ... earlier code to compute amountInBig, minOut, toAddr, toToken, toDec, expectedOut, etc. ...

        // 3) prepare swap amounts
        const pair = new ethers.Contract(ADDRESSES.PAIR_USDC_BFL, ABIS.UniswapV2Pair, signer);
        let amount0Out = 0n, amount1Out = 0n;
        
        // Determine which output amount to use based on token order
        const toAddrLower = toAddr.toLowerCase();
        if (toAddrLower === pairCache.token0) {
          amount0Out = minOut;
        } else if (toAddrLower === pairCache.token1) {
          amount1Out = minOut;
        } else {
          throw new Error("Token not in this pair");
        }
        
        log(`Swap amounts: amount0Out=${amount0Out}, amount1Out=${amount1Out}`, "debug");

        // 4) simulate swap via callStatic (detect revert reason)
        try {
          await pair.callStatic.swap(amount0Out, amount1Out, userAddress, "0x");
          log("swap simulation successful (callStatic) — looks OK", "debug");
        } catch (simErr) {
          log("Swap simulation failed: " + getWalletErrorMessage(simErr), "error");
          dumpError(simErr);
          throw simErr;
        }

        // 5) estimate gas for swap (diagnostic)
        try {
          const gasEstimate = await pair.swap.estimateGas(amount0Out, amount1Out, userAddress, "0x");
          log("swap.estimateGas => " + gasEstimate.toString(), "debug");
        } catch (estErr) {
          log("Swap gas estimate failed (diagnostic): " + getWalletErrorMessage(estErr), "warning");
          dumpError(estErr);
        }

        // 6) send swap tx
        let swapTx;
        try {
          swapTx = await pair.swap(amount0Out, amount1Out, userAddress, "0x");
          log("Swap pending: " + swapTx.hash.slice(0,10) + "...", "debug");
          await swapTx.wait();
          log("Swap complete! Got ~" + formatAmount(expectedOut, toDec) + " " + toToken, "info");
        } catch (err) {
          log("Swap failed: " + getWalletErrorMessage(err), "error");
          dumpError(err);
          throw err;
        }

        await loadBalances();
        await loadPairReserves();
      } catch (err) {
        console.error("handleSwap final catch:", err);
      } finally {
        txInProgress = false;
        if (swapBtn) { swapBtn.disabled = false; swapBtn.classList.remove('loading'); }
      }
    }

    /* ==========================
       Liquidity handlers
       ========================== */
async function handleAddLiquidity() {
      if (!signer || !userAddress) { log("Please connect wallet first", "warning"); return; }
      const usdcAmount = $("liquidityUSDC")?.value;
      const bflAmount = $("liquidityBFL")?.value;
      if (!usdcAmount || !bflAmount || parseFloat(usdcAmount) <= 0 || parseFloat(bflAmount) <= 0) { log("Enter both USDC and BFL amounts", "warning"); return; }
      try {
        log("Adding liquidity: " + usdcAmount + " USDC + " + bflAmount + " BFL", "info");
        const usdcDec = await getDecimals(ADDRESSES.USDC, readProvider);
        const bflDec = await getDecimals(ADDRESSES.BFL, readProvider);
        const usdcBig = parseAmount(usdcAmount, usdcDec);
        const bflBig = parseAmount(bflAmount, bflDec);
        log("Transferring USDC to pair...", "debug");
        const usdcContract = new ethers.Contract(ADDRESSES.USDC, ABIS.ERC20, signer);
        const usdcTx = await usdcContract.transfer(ADDRESSES.PAIR_USDC_BFL, usdcBig);
        await usdcTx.wait();
        log("Transferring BFL to pair...", "debug");
        const bflContract = new ethers.Contract(ADDRESSES.BFL, ABIS.ERC20, signer);
        const bflTx = await bflContract.transfer(ADDRESSES.PAIR_USDC_BFL, bflBig);
        await bflTx.wait();
        log("Minting LP tokens...", "debug");
        const pair = new ethers.Contract(ADDRESSES.PAIR_USDC_BFL, ABIS.UniswapV2Pair, signer);
        const mintTx = await pair.mint(userAddress);
        await mintTx.wait();
        log("Liquidity added successfully!", "info");
        await loadBalances(); await loadPairReserves();
        if ($("liquidityUSDC")) $("liquidityUSDC").value = "";
        if ($("liquidityBFL")) $("liquidityBFL").value = "";
      } catch (err) {
        log("Add liquidity failed: " + getWalletErrorMessage(err), "error");
        dumpError(err);
      }
    }

    /* ==========================
       Rest of the app script (event listeners, UI helpers, etc.)
       ========================== */

    // ---- Example wiring (ensure these match your codebase) ----
    document.addEventListener('DOMContentLoaded', () => {
      try { updateTokenLogos(); initChart && initChart(); loadPairReserves && loadPairReserves(); } catch(e){}
      const connectBtn = $("connectBtn");
      if (connectBtn) connectBtn.onclick = connectWallet;
      const swapBtn = $("swapBtn");
      if (swapBtn) swapBtn.onclick = handleSwap;
      const addLiquidityBtn = $("addLiquidityBtn");
      if (addLiquidityBtn) addLiquidityBtn.onclick = handleAddLiquidity;
      const refreshAllBtn = $("refreshAllBtn");
      if (refreshAllBtn) refreshAllBtn.onclick = async () => { await loadBalances(); await loadPairReserves(); };
    });

  </script>
